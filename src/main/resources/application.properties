# Service Discovery - Eureka Server
spring.application.name=service-registry
server.port=8761

# Running standalone, so don't try to register with another Eureka
eureka.instance.hostname=localhost
eureka.client.fetch-registry=false
eureka.client.register-with-eureka=false

# Dev mode - turn off self-preservation to see changes faster
# TODO: enable this in production!
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=10000
eureka.server.renewal-percent-threshold=0.50

# Actuator endpoints for monitoring
management.info.git.mode=full
management.endpoints.web.exposure.include=health,info,prometheus,metrics,eureka
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# Not using tracing yet
management.tracing.enabled=false
management.tracing.sampling.probability=1

# Logging - keeping Eureka verbose for now to debug registration issues
logging.level.com.netflix.eureka=DEBUG
logging.level.org.springframework.cloud.netflix.eureka=DEBUG
logging.level.root=INFO
